<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from Duncan</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #1f2328;
      --muted: #57606a;
      --accent: #2f6feb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --text: #e6e8eb;
        --muted: #a0a7b0;
        --accent: #6ea8ff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 640px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    h1::after {
      content: "";
      display: block;
      width: 48px;
      height: 4px;
      margin-top: 16px;
      border-radius: 2px;
      background: var(--accent);
    }

    p {
      margin: 0;
      font-size: 1.125rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Duncan: AI build project, week 1</h1>
    <p>
      This is the first page of my AI build project. Each week I'm learning
      something new by building it, starting here with a simple web page
      written by hand and published with git and GitHub.
    </p>
  </main>
</body>
</html>
